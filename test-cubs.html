<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetAllTix - Advanced Search Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <div class="mb-8 p-6 bg-white rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="text-xs font-bold text-blue-600 uppercase tracking-widest">GetAllTix Engine v2.1</span>
                <h1 class="text-xl font-black text-gray-550 mt-1 mb-3">St. Louis Cardinals at Chicago Cubs</h1>
                <p class="text-gray-500 text-sm">Wrigley Field • Saturday, July 4, 2026 • 7:08 PM</p>
            </div>
            
            <!-- Sorting Controls -->
            <div class="bg-gray-100 p-1.5 rounded-2xl flex gap-2 w-full md:w-auto">
                <button onclick="changeSort('cheapest')" id="btn-cheapest" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl font-bold text-sm transition bg-white text-gray-900 shadow-sm">
                    Cheapest Price
                </button>
                <button onclick="changeSort('best-deal')" id="btn-best-deal" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl font-bold text-sm transition text-gray-600 hover:text-gray-900">
                    Best Deal
                </button>
                <button onclick="changeSort('best-seat')" id="btn-best-seat" class="flex-1 md:flex-none px-4 py-2.5 rounded-xl font-bold text-sm transition text-gray-600 hover:text-gray-900">
                    Best Seat
                </button>
            </div>
        </div>

        <!-- TWO COLUMN LAYOUT -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- LEFT/CENTER: TOP 10 MAIN LIST (2/3 Width) -->
            <div class="lg:col-span-2 space-y-4">
                <h2 class="text-xl font-black text-gray-950 flex items-center gap-2 px-2">
                    Top 10 Market Listings
                    <span id="sort-indicator" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full uppercase tracking-wider">Cheapest First</span>
                </h2>
                <div id="main-top-10-container" class="space-y-3">
                    <!-- Injected dynamically -->
                </div>
            </div>

            <!-- RIGHT: TOP 3 PER SITE SIDEBAR (1/3 Width) -->
            <div class="space-y-6">
                <h2 class="text-xl font-black text-gray-950 px-2">Top 3 Deals Per Site</h2>
                
                <!-- Ticketmaster Column -->
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                    <div class="flex items-center gap-2 border-b pb-2 mb-2">
                        <span class="w-3 h-3 rounded-full bg-blue-900"></span>
                        <h3 class="font-bold text-sm text-blue-950 uppercase tracking-wider">Ticketmaster Top 3</h3>
                    </div>
                    <div id="tm-deals" class="space-y-2"></div>
                </div>

                <!-- StubHub Column -->
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                    <div class="flex items-center gap-2 border-b pb-2 mb-2">
                        <span class="w-3 h-3 rounded-full bg-orange-500"></span>
                        <h3 class="font-bold text-sm text-orange-600 uppercase tracking-wider">StubHub Top 3</h3>
                    </div>
                    <div id="sh-deals" class="space-y-2"></div>
                </div>

                <!-- TickPick Column -->
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                    <div class="flex items-center gap-2 border-b pb-2 mb-2">
                        <span class="w-3 h-3 rounded-full bg-blue-400"></span>
                        <h3 class="font-bold text-sm text-blue-500 uppercase tracking-wider">TickPick Top 3</h3>
                    </div>
                    <div id="tp-deals" class="space-y-2"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // 1. Updated Mock Dataset reflecting real Wrigley Field mapping & holiday price premium
        const rawApiData = [
            { vendor: 'Ticketmaster', section: '114', row: '4', price: 285.00, expected: 320 },
            { vendor: 'Ticketmaster', section: '220', row: '12', price: 175.00, expected: 190 },
            { vendor: 'Ticketmaster', section: '413', row: '7', price: 123.00, expected: 130 },
            { vendor: 'Ticketmaster', section: '430', row: '5', price: 140.00, expected: 125 },
            { vendor: 'StubHub', section: '12', row: '2', price: 340.00, expected: 450 }, // Big deal baseline
            { vendor: 'StubHub', section: '215', row: '8', price: 160.00, expected: 195 },
            { vendor: 'StubHub', section: '405', row: '3', price: 115.00, expected: 135 },
            { vendor: 'StubHub', section: '422', row: '11', price: 110.00, expected: 120 },
            { vendor: 'TickPick', section: '18', row: '5', price: 395.00, expected: 430 },
            { vendor: 'TickPick', section: '228', row: '14', price: 155.00, expected: 185 },
            { vendor: 'TickPick', section: '409', row: '6', price: 120.00, expected: 130 },
            { vendor: 'TickPick', section: '431', row: '2', price: 108.00, expected: 120 }
        ];

        let currentSortMode = 'cheapest';

        // 2. Updated Value Score & Seat Quality mapping for Wrigley
        function processTickets() {
            return rawApiData.map(t => {
                const sectionNum = parseInt(t.section);
                
                // Value calculation baseline
                let valueScore = ((t.expected / t.price) * 7.5);
                valueScore = Math.min(Math.max(valueScore, 1), 10);

                // Wrigley Field Specific Tier Categorization
                let seatRank = 0;
                let tierLabel = 'Upper Deck';
                
                if (sectionNum <= 99) {
                    seatRank = 95; // Premium Field/Club Box
                    tierLabel = 'Premium Infield';
                } else if (sectionNum >= 100 && sectionNum <= 199) {
                    seatRank = 80; // Main 100 Level
                    tierLabel = '100 Level Field';
                } else if (sectionNum >= 200 && sectionNum <= 299) {
                    seatRank = 60; // 200 Level Terrace
                    tierLabel = '200 Level Terrace';
                } else {
                    seatRank = 30; // 400/500 Upper Decks
                    tierLabel = 'Upper Deck';
                }

                let vendorStyle = 'border-l-blue-900 text-blue-900';
                if (t.vendor === 'StubHub') vendorStyle = 'border-l-orange-500 text-orange-600';
                if (t.vendor === 'TickPick') vendorStyle = 'border-l-blue-400 text-blue-500';

                return {
                    ...t,
                    valueScore: parseFloat(valueScore.toFixed(1)),
                    seatRank: seatRank,
                    tierLabel: tierLabel,
                    vendorStyle: vendorStyle
                };
            });
        }

        // 3. Main Master Render Function
        function renderDashboard() {
            const allTickets = processTickets();

            let sortedMainList = [...allTickets];
            const indicator = document.getElementById('sort-indicator');
            
            if (currentSortMode === 'cheapest') {
                sortedMainList.sort((a, b) => a.price - b.price);
                indicator.innerText = "Cheapest Price";
            } else if (currentSortMode === 'best-deal') {
                sortedMainList.sort((a, b) => b.valueScore - a.valueScore);
                indicator.innerText = "Best Deal Value";
            } else if (currentSortMode === 'best-seat') {
                sortedMainList.sort((a, b) => b.seatRank - a.seatRank || a.price - b.price);
                indicator.innerText = "Premium Seats First";
            }

            // Render Top 10 Main Column
            const mainContainer = document.getElementById('main-top-10-container');
            mainContainer.innerHTML = '';
            
            sortedMainList.slice(0, 10).forEach((t, index) => {
                mainContainer.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 ${t.vendorStyle} flex justify-between items-center hover:shadow-md transition">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-black uppercase tracking-wider">${t.vendor}</span>
                                <span class="text-[10px] px-2 py-0.5 font-bold rounded-full bg-gray-100 text-gray-600">Rank #${index + 1}</span>
                            </div>
                            <p class="text-xl font-extrabold text-gray-900">Sec ${t.section}, Row ${t.row}</p>
                            <div class="flex gap-3 text-xs mt-1">
                                <span class="font-medium text-green-600">Deal Score: ${t.valueScore}/10</span>
                                <span class="text-gray-400">|</span>
                                <span class="text-gray-500">${t.tierLabel}</span>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <span class="text-2xl font-black text-gray-950">$${t.price.toFixed(2)}</span>
                            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-2 px-5 rounded-xl transition">View</button>
                        </div>
                    </div>
                `;
            });

            // Render Sidebar (Always sorting each vendor by Value Score descending, max 3)
            ['Ticketmaster', 'StubHub', 'TickPick'].forEach(v => {
                const vendorDeals = allTickets
                    .filter(t => t.vendor === v)
                    .sort((a, b) => b.valueScore - a.valueScore)
                    .slice(0, 3);

                const divId = v === 'Ticketmaster' ? 'tm-deals' : v === 'StubHub' ? 'sh-deals' : 'tp-deals';
                const container = document.getElementById(divId);
                container.innerHTML = '';

                vendorDeals.forEach(t => {
                    container.innerHTML += `
                        <div class="p-2.5 rounded-xl bg-gray-50 border border-gray-100 flex justify-between items-center text-xs">
                            <div>
                                <p class="font-bold text-gray-900">Sec ${t.section}, Row ${t.row}</p>
                                <p class="text-green-600 font-medium">Score: ${t.valueScore}/10</p>
                            </div>
                            <span class="font-black text-gray-950 text-sm">$${t.price.toFixed(2)}</span>
                        </div>
                    `;
                });
            });
        }

        // 4. Controller Layer
        function changeSort(mode) {
            currentSortMode = mode;
            
            ['cheapest', 'best-deal', 'best-seat'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "flex-1 md:flex-none px-4 py-2.5 rounded-xl font-bold text-sm transition bg-white text-gray-900 shadow-sm";
                } else {
                    btn.className = "flex-1 md:flex-none px-4 py-2.5 rounded-xl font-bold text-sm transition text-gray-600 hover:text-gray-900";
                }
            });

            renderDashboard();
        }

        // Initialize layout
        renderDashboard();
    </script>
</body>
</html>
